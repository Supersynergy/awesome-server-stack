<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#0E1A2E"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="0.5" stop-color="#34D399"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <circle cx="1080" cy="90" r="300" fill="#2563EB" opacity="0.16" filter="url(#blur18)"/>
  <circle cx="120" cy="580" r="260" fill="#22C55E" opacity="0.14" filter="url(#blur18)"/>
  <ellipse cx="980" cy="330" rx="290" ry="230" fill="url(#glow)"/>

  <!-- request streams into the rack -->
  <g stroke="url(#stream)" stroke-width="3" fill="none" opacity="0.85">
    <path d="M60 140 C 400 120, 660 200, 840 245"/>
    <path d="M60 330 C 380 330, 660 330, 812 330"/>
    <path d="M60 500 C 400 520, 660 450, 840 415"/>
  </g>
  <g fill="#A7F3D0" font-family="Menlo, monospace" font-size="20" opacity="0.55">
    <text x="80" y="130">GET /  ·  200 OK  ·  0.9ms</text>
    <text x="80" y="322">Cache-Status: hit</text>
    <text x="80" y="540">stale-while-revalidate=60</text>
  </g>

  <!-- server rack -->
  <g transform="translate(980,320)">
    <rect x="-150" y="-190" width="300" height="380" rx="18" fill="#0B1424" stroke="url(#rack)" stroke-width="5"/>
    <g>
      <rect x="-118" y="-152" width="236" height="66" rx="10" fill="#10233C" stroke="#34D399" stroke-width="3"/>
      <circle cx="-92" cy="-119" r="8" fill="#34D399"/>
      <circle cx="-66" cy="-119" r="8" fill="#34D399" opacity="0.5"/>
      <rect x="-40" y="-128" width="130" height="18" rx="9" fill="#1D4ED8" opacity="0.8"/>
    </g>
    <g>
      <rect x="-118" y="-62" width="236" height="66" rx="10" fill="#10233C" stroke="#34D399" stroke-width="3" opacity="0.9"/>
      <circle cx="-92" cy="-29" r="8" fill="#34D399"/>
      <circle cx="-66" cy="-29" r="8" fill="#2563EB"/>
      <rect x="-40" y="-38" width="130" height="18" rx="9" fill="#34D399" opacity="0.5"/>
    </g>
    <g>
      <rect x="-118" y="28" width="236" height="66" rx="10" fill="#10233C" stroke="#2563EB" stroke-width="3"/>
      <circle cx="-92" cy="61" r="8" fill="#2563EB"/>
      <circle cx="-66" cy="61" r="8" fill="#34D399"/>
      <rect x="-40" y="52" width="130" height="18" rx="9" fill="#1D4ED8" opacity="0.8"/>
    </g>
    <g>
      <rect x="-118" y="118" width="236" height="66" rx="10" fill="#10233C" stroke="#2563EB" stroke-width="3" opacity="0.8"/>
      <circle cx="-92" cy="151" r="8" fill="#34D399" opacity="0.7"/>
      <rect x="-40" y="142" width="130" height="18" rx="9" fill="#34D399" opacity="0.35"/>
    </g>
  </g>

  <!-- glass card -->
  <rect x="72" y="88" width="760" height="464" rx="30" fill="#FFFFFF" opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.14"/>

  <text x="116" y="168" fill="#34D399" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="3">THE 2026 INDEX · 55+ TOOLS</text>
  <text x="112" y="272" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="800">Awesome Server</text>
  <text x="112" y="352" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="800">Stack</text>
  <text x="116" y="418" fill="#F8FAFC" opacity="0.8" font-family="Inter, Arial, sans-serif" font-size="27">Drop legacy infra. Benchmarks, not vibes.</text>
  <text x="116" y="486" fill="#F8FAFC" opacity="0.62" font-family="Inter, Arial, sans-serif" font-size="22">Caddy · Pingora · Elysia · Dragonfly · Coolify · FrankenPHP</text>
</svg>
